name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish src/VehicleMotionCues/VehicleMotionCues.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: VehicleMotionCues-win-x64
          path: publish/win-x64/VehicleMotionCues.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" publish/win-x64/VehicleMotionCues.exe --clobber

  # Experimental: compiles the macOS build so it doesn't rot before the Mac version ships.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (osx-arm64)
        run: >
          dotnet publish src/VehicleMotionCues/VehicleMotionCues.csproj -c Release -r osx-arm64
          -p:VmcTarget=mac --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish/osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: VehicleMotionCues-osx-arm64-experimental
          path: publish/osx-arm64/VehicleMotionCues
